services:
  - type: web
    name: rps-auto-motors
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - rpsautomotors.com
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
